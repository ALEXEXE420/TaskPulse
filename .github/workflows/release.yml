# Bei einem Tag "v1.2.3": TaskPulse bauen und als Release mit TaskPulse-Setup.exe veröffentlichen.
# Installierte TaskPulse-Versionen holen sich genau diese Datei als Update.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Tag und Cargo.toml-Version vergleichen
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} passt nicht zur Version $v in Cargo.toml" }

      - name: Tests
        run: cargo test

      - name: Bauen
        run: cargo build --release

      - name: Installer bereitstellen
        shell: pwsh
        run: |
          Copy-Item target/release/TaskPulse.exe TaskPulse-Setup.exe
          (Get-FileHash TaskPulse-Setup.exe -Algorithm SHA256).Hash.ToLower() + "  TaskPulse-Setup.exe" | Out-File -Encoding ascii TaskPulse-Setup.exe.sha256

      - name: Änderungen dieser Version aus CHANGELOG.md
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          $text = Get-Content CHANGELOG.md -Raw -Encoding utf8
          $m = [regex]::Match($text, "(?ms)^## " + [regex]::Escape($v) + "\b[^\r\n]*\r?\n(.*?)(?=^## |\z)")
          if (-not $m.Success -or -not $m.Groups[1].Value.Trim()) { throw "In CHANGELOG.md fehlt der Abschnitt '## $v'" }
          "## Was ist neu in $v`n`n" + $m.Groups[1].Value.Trim() | Out-File -Encoding utf8 release_notes.md

      - uses: softprops/action-gh-release@v3
        with:
          body_path: release_notes.md
          files: |
            TaskPulse-Setup.exe
            TaskPulse-Setup.exe.sha256
          generate_release_notes: true
